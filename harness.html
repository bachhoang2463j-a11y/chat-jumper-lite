<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Chat Jumper Lite 测试 harness（模拟酒馆父页面）</title>
<style>
  body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; }
  #panel { width: 340px; padding: 12px; overflow-y: auto; border-right: 1px solid #ccc; }
  #stage { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #extensionsMenu { border-bottom: 1px solid #999; padding: 6px; display: flex; gap: 8px; }
  .extension_container .list-group-item { display: flex; gap: 6px; cursor: pointer; padding: 4px 8px; border: 1px solid #aaa; width: fit-content; }
  #simplebar-wrapper { flex: 1; overflow-y: auto; border: 1px solid #666; }
  #chat { display: flex; flex-direction: column; }
  .mes { height: 120px; border-bottom: 1px solid #ddd; padding: 8px; box-sizing: border-box; flex: none; }
  #log { white-space: pre-wrap; font-family: monospace; font-size: 12px; margin-top: 8px; }
  button.t { display: block; width: 100%; margin: 4px 0; padding: 6px; }
  .pass { color: green; } .fail { color: red; }
</style>
</head>
<body>
<div id="panel">
  <button class="t" onclick="runAll()">▶ 运行全部测试</button>
  <div id="log"></div>
</div>
<div id="stage">
  <div id="extensionsMenu"></div>
  <div class="simplebar-content-wrapper" id="simplebar-wrapper">
    <div id="chat"></div>
  </div>
</div>
<iframe id="th-sandbox" src="sandbox.html" style="display:none"></iframe>
<script>
// ---- mock 数据与酒馆环境（2000 楼聊天）----
const CHAT_LEN = 2000;
const chat = Array.from({ length: CHAT_LEN }, (_, i) => ({
  mes: `msg ${i}`, name: i % 2 ? 'User' : 'AI', is_user: i % 2 === 1,
}));
const state = { popupAnswer: '', confirmAnswer: 1, emitted: [], lastToast: null, reloads: 0 };

function renderMes(id) {
  const d = document.createElement('div');
  d.className = 'mes';
  d.setAttribute('mesid', String(id));
  d.textContent = `#${id} ${chat[id].name}: ${chat[id].mes}`;
  return d;
}
function addOneMessage(mes, options = {}) {
  const id = options.forceId ?? 0;
  const el = renderMes(id);
  const chatEl = document.getElementById('chat');
  if (options.insertBefore != null) {
    const ref = chatEl.querySelector(`:scope > .mes[mesid="${options.insertBefore}"]`);
    chatEl.insertBefore(el, ref);
  } else {
    chatEl.appendChild(el);
  }
}
window.SillyTavern = {
  POPUP_TYPE: { INPUT: 2, CONFIRM: 3 },
  callGenericPopup: (content, type) => {
    if (type === 3) return Promise.resolve(state.confirmAnswer);
    return Promise.resolve(state.popupAnswer);
  },
  reloadCurrentChat: async () => {
    state.reloads++;
    const chatEl = document.getElementById('chat');
    chatEl.replaceChildren();
    for (let i = CHAT_LEN - 20; i < CHAT_LEN; i++) chatEl.appendChild(renderMes(i));
  },
  getContext: () => ({
    chat,
    addOneMessage,
    powerUserSettings: { auto_scroll_chat_to_bottom: true },
    eventSource: { emit: (t, id) => state.emitted.push({ type: t, id }) },
    eventTypes: {
      MORE_MESSAGES_LOADED: 'more_messages_loaded',
      USER_MESSAGE_RENDERED: 'user_message_rendered',
      CHARACTER_MESSAGE_RENDERED: 'character_message_rendered',
    },
    reloadCurrentChat: window.SillyTavern.reloadCurrentChat,
  }),
};
window.toastr = {
  info: m => state.lastToast = m, warning: m => state.lastToast = m,
  error: m => state.lastToast = m, success: m => state.lastToast = m,
};
</script>
<script>
// ---- 测试用例 ----
const logEl = document.getElementById('log');
function log(msg, cls) {
  const d = document.createElement('div');
  d.textContent = msg;
  if (cls) d.className = cls;
  logEl.appendChild(d);
}
function assert(name, cond, detail) {
  log(`${cond ? 'PASS' : 'FAIL'} ${name}${cond ? '' : ' —— ' + (detail ?? '')}`, cond ? 'pass' : 'fail');
  return cond;
}
function displayed() {
  const list = [...document.querySelectorAll('#chat > .mes')];
  return {
    count: list.length,
    first: Number(list[0]?.getAttribute('mesid')),
    last: Number(list.at(-1)?.getAttribute('mesid')),
  };
}
function wrapper() { return document.getElementById('simplebar-wrapper'); }
const sleep = ms => new Promise(r => setTimeout(r, ms));

// IAB 隐藏页 rAF/setTimeout 被钳制（约 1s/帧），固定睡眠不可靠，轮询等稳定
async function waitFor(cond, timeout = 10000, interval = 100) {
  const deadline = Date.now() + timeout;
  while (Date.now() < deadline) {
    if (cond()) return true;
    await sleep(interval);
  }
  return cond();
}

async function clickJump() {
  document.getElementById('stcj-lite-button').click();
  await sleep(300);
}
async function wheelUp() {
  const before = displayed().count;
  // 真实 Chrome 里 rAF 快，上一批补齐的 250ms 冷却可能尚未过期，先等它过去
  await sleep(300);
  wrapper().dispatchEvent(new WheelEvent('wheel', { deltaY: -100, bubbles: true }));
  await waitFor(() => displayed().count >= before + 5);
}
async function wheelDown() {
  const before = displayed().count;
  await sleep(300);
  wrapper().scrollTo({ top: wrapper().scrollHeight });
  await sleep(50);
  wrapper().dispatchEvent(new WheelEvent('wheel', { deltaY: 100, bubbles: true }));
  await waitFor(() => displayed().count >= before + 5);
}
// 模拟滚动链：改变 scrollTop 后派发 scroll 事件（真实浏览器随后还会补派一次原生
// scroll 事件，届时基线已与当前值一致、delta=0 被忽略，不会双重补齐）
function scrollStep(top) {
  const w = wrapper();
  w.scrollTop = top;
  w.dispatchEvent(new Event('scroll'));
}

async function t1() {
  log('--- T1 按钮注入 ---');
  assert('扩展抽屉出现「跳转楼层」按钮', !!document.getElementById('stcj-lite-button'));
}
async function t2() {
  log('--- T2 跳转楼层 500：重建 5 楼窗口 ---');
  state.confirmAnswer = -1; state.popupAnswer = '500';
  await clickJump();
  const d = displayed();
  assert('窗口首楼 = 500', d.first === 500, JSON.stringify(d));
  assert('窗口末楼 = 504', d.last === 504);
  assert('共 5 楼', d.count === 5);
}
async function t3() {
  log('--- T3 向上滑动补齐 5 楼 ---');
  await wheelUp();
  const d = displayed();
  assert('首楼 = 495', d.first === 495, JSON.stringify(d));
  assert('共 10 楼', d.count === 10);
  assert('触发 MORE_MESSAGES_LOADED', state.emitted.some(e => e.type === 'more_messages_loaded'));
}
async function t4() {
  log('--- T4 向下滑动补齐 5 楼 ---');
  await wheelDown();
  const d = displayed();
  assert('末楼 = 509', d.last === 509, JSON.stringify(d));
  assert('共 15 楼', d.count === 15);
}
async function t5() {
  log('--- T5 越界输入 clamp 到最大楼 ---');
  state.confirmAnswer = -1; state.popupAnswer = '99999';
  await clickJump();
  const d = displayed();
  assert('首楼 = 1999', d.first === 1999, JSON.stringify(d));
  assert('仅 1 楼', d.count === 1);
}
async function t6() {
  log('--- T6 恢复完整显示 ---');
  state.confirmAnswer = 1;
  document.getElementById('stcj-lite-button').click();
  await sleep(300);
  const d = displayed();
  assert('恢复尾部 20 楼', d.count === 20 && d.last === 1999, JSON.stringify(d));
  assert('reloadCurrentChat 被调用', state.reloads >= 1);
}
async function t7() {
  log('--- T7 楼层渲染事件补发（iframe 保活） ---');
  state.emitted = [];
  state.confirmAnswer = -1; state.popupAnswer = '500';
  await clickJump();          // 窗口 500-504
  await wheelUp();            // 补 495-499
  await wheelDown();          // 补 505-509
  let ok = true;
  for (let id = 495; id <= 509; id++) {
    const expected = chat[id].is_user ? 'user_message_rendered' : 'character_message_rendered';
    const hits = state.emitted.filter(e => e.id === id && e.type === expected).length;
    if (hits !== 1) { ok = false; log(`  楼层 ${id} 期望 1 次 ${expected}，实际 ${hits}`, 'fail'); }
  }
  assert('495-509 每楼恰好补发 1 次正确类型的渲染事件', ok);
  const stray = state.emitted.filter(e => e.id != null && (e.id < 495 || e.id > 509));
  assert('无区间外的楼层渲染事件', stray.length === 0, JSON.stringify(stray));
  assert('补齐批次仍发 MORE_MESSAGES_LOADED', state.emitted.filter(e => e.type === 'more_messages_loaded').length >= 2);
}

async function t8() {
  log('--- T8 scroll 位置兜底（无滚轮事件，模拟代码块 iframe 上的滚动链） ---');
  // 5 楼 × 120px 可能不满一屏导致 scrollTop 无法移动；wrapper 是 flex:1 子项，
  // 需同时禁用 flex 才能让固定高度生效，制造出滚动空间
  const w = wrapper();
  const prevHeight = w.style.height;
  const prevFlex = w.style.flex;
  w.style.flex = 'none';
  w.style.height = '300px';
  try {
    state.confirmAnswer = -1; state.popupAnswer = '500';
    state.emitted = [];
    await clickJump();          // 窗口 500-504
    // 首次 scroll 建立方向基线（delta=0 被忽略）
    scrollStep(150);
    await sleep(100);
    // 向下滚到底 → scroll 兜底补 505-509
    const beforeDown = displayed().last;
    scrollStep(w.scrollHeight);
    const okDown = await waitFor(() => displayed().last >= beforeDown + 5);
    const d1 = displayed();
    assert('scroll 贴底触发向下补齐', okDown && d1.last === 509 && d1.count === 10, JSON.stringify(d1));
    // 向上滚到顶 → scroll 兜底补 495-499
    const beforeUp = displayed().first;
    scrollStep(0);
    const okUp = await waitFor(() => displayed().first <= beforeUp - 5);
    const d2 = displayed();
    assert('scroll 贴顶触发向上补齐', okUp && d2.first === 495 && d2.count === 15, JSON.stringify(d2));
    assert('scroll 补齐仍发 MORE_MESSAGES_LOADED',
      state.emitted.filter(e => e.type === 'more_messages_loaded').length >= 2);
    // 重建钳位保护：滚动到顶状态下再次跳转，replaceChildren 引发的 scrollTop 钳位
    // 不应被误判为“向上滚动”而自动补上方楼层
    state.popupAnswer = '600';
    await clickJump();          // 窗口 600-604
    await sleep(1200);          // 留出钳位 scroll 事件派发的时间窗
    const d3 = displayed();
    assert('跳转重建后不因 scrollTop 钳位误触发补齐', d3.first === 600 && d3.count === 5, JSON.stringify(d3));
  } finally {
    w.style.height = prevHeight;
    w.style.flex = prevFlex;
  }
}

async function runAll() {
  logEl.innerHTML = '';
  state.emitted = []; state.reloads = 0;
  // 初始渲染尾部 20 楼，模拟酒馆原生 chat_truncation 截断
  const chatEl = document.getElementById('chat');
  chatEl.replaceChildren();
  for (let i = CHAT_LEN - 20; i < CHAT_LEN; i++) chatEl.appendChild(renderMes(i));
  await sleep(200);
  for (const t of [t1, t2, t3, t4, t5, t6, t7, t8]) {
    await t();
    await sleep(100);
  }
  log('=== 测试完成 ===');
}
</script>
</body>
</html>
